version: 2

submodules:
  include: all

build:
  os: ubuntu-lts-latest
  tools:
    # just so RTD stops complaining
    python: "latest"
  jobs:
    create_environment:
      # Pin pixi to a known-good version instead of `latest`, so docs builds are
      # reproducible and a bad pixi release cannot break them without a commit here.
      # Bump freely, ideally alongside `PIXI_VERSION` in ci.yaml.
      - asdf plugin add pixi
      - asdf install pixi 0.76.2
      - asdf global pixi 0.76.2
    install:
      - pixi install -e docs
    build:
      html:
        - NO_COLOR=1 pixi run -e docs mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html
